[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "beliefmesh"
version = "1.0.0"
description = "Belief exchange for deployable decentralised continual learning (BeliefMesh)"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "torchvision>=0.17",
    "numpy>=1.26",
    "scipy>=1.12",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
    "imageio>=2.34",
    "imageio-ffmpeg>=0.4.9",
]

[tool.setuptools.packages.find]
include = ["beliefmesh*"]

[tool.setuptools.package-data]
"beliefmesh.simulation" = ["environments/*.npy"]
